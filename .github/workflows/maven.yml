
name: Maven Selenium Docker CI

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t nedit23/selenium-local-web-test:latest .
          docker tag nedit23/selenium-local-web-test:latest nedit23/selenium-local-web-test:${{ github.sha }}

      - name: Run Selenium Tests
        run: |
          docker run --rm nedit23/selenium-local-web-test:latest

      - name: Push Docker Image with Two Tags
        if: github.event_name == 'push'
        run: |
          docker push nedit23/mavenrx:latest
          docker push nedit23/mavenrx${{ github.sha }}
